# vLLM serve arguments for Muse-Glimmer-30B on gfx1151 (Strix Halo).
# Single source of truth for the model-serving flags. Parsed (comments stripped)
# by scripts/03-serve-vllm.sh. Every line here is deliberate — see
# docs/adaptation.md for the MI300X -> gfx1151 delta and the *why*.
#
# Adaptations encoded below (and what is intentionally ABSENT):
#   --dtype bfloat16          BF16 only; RDNA 3.5 has no usable FP8 path.
#   --attention-backend ...    FLASH_ATTN (Triton-AMD). NOT AITER (RDNA4/CDNA3+).
#   --tensor-parallel-size 1   single GPU (the APU's unified memory pool).
#   tool/reasoning parsers     muse_glimmer (the ATEM XML-style tool channel +
#                              channel-scoped reasoning).
# Absent by design (see docs/adaptation.md): RDNA chunked prefill (hangs on
# RDNA 3.5), speculative decoding (not in v1), FP8 KV cache, FP8 quantization.
--served-model-name muse-glimmer
--tensor-parallel-size 1
--dtype bfloat16
--max-model-len 131072
--attention-backend FLASH_ATTN
--enable-auto-tool-choice
--tool-call-parser muse_glimmer
--reasoning-parser muse_glimmer
--generation-config auto
--gpu-memory-utilization 0.90

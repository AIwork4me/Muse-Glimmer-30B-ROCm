name: fast-ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  no-gpu:
    # This job intentionally installs only the CPU-safe `ci` dependency group.
    # The TheRock/ROCm lock is checked separately in dependency-smoke.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync lightweight CI dependencies
        run: uv sync --only-group ci --locked

      - name: Assert GPU runtime is not installed
        run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"

      - name: Bash syntax
        run: bash -n scripts/*.sh scripts/lib/*.sh

      - name: ShellCheck
        run: uv run --no-sync shellcheck -x scripts/*.sh scripts/lib/*.sh

      - name: GitHub Actions semantics
        run: uv run --no-sync actionlint

      - name: No-GPU tests
        run: uv run --no-sync pytest -m "not gpu and not server" -v
